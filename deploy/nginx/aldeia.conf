# TechLab+ Aldeia — ACASA — reverse proxy (template versionado, sem secrets).
# Instalado em /etc/nginx/sites-available/aldeia.conf.
#
# Estado atual: NAO ha dominio destinado ao sistema, portanto NAO ha TLS e a
# porta 80/443 permanece FECHADA no firewall (producao publica = nao). Quando
# houver dominio: preencher server_name, emitir certificado (certbot) e abrir
# 80/443 no UFW. Nao servir dados pessoais/financeiros em HTTP puro.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
